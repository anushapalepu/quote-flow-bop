<div class="container">

    <button
       mat-raised-button
       color="primary">
       Add Quote
    </button>
  
    <table mat-table [dataSource]="[]">
  
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{row.id}}</td>
      </ng-container>
  
      <tr mat-header-row
          *matHeaderRowDef="displayedColumns">
      </tr>
  
      <tr mat-row
          *matRowDef="let row;
          columns:displayedColumns">
      </tr>
  
    </table>
  
  </div>
